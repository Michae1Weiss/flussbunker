[package]
name = "flussbunker"
version = "0.1.0"
edition = "2021"

[dependencies]
# Exact pin: a Bevy minor bump is a migration and a separate decision.
bevy = "=0.19.1"

[features]
default = []
dev = ["bevy/bevy_dev_tools"]

[lints.clippy]
# Bevy systems legitimately take many parameters and complex query types.
type_complexity = "allow"
too_many_arguments = "allow"

# Dependencies compiled for speed of execution, our own code for speed of compile.
[profile.dev.package."*"]
opt-level = 3

[profile.dev]
opt-level = 1

[profile.release]
lto = "thin"
codegen-units = 1
