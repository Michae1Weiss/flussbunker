[package]
name = "flussbunker"
version = "0.1.0"
edition = "2021"

[dependencies]
bevy = { version = "=0.19.1", default-features = false, features = ["2d", "ui", "audio"] }

[features]
default = []
dev = ["bevy/bevy_dev_tools"]

[lints.clippy]
# Bevy systems legitimately take many parameters and complex query types.
type_complexity = "allow"
too_many_arguments = "allow"

# Dependencies compiled for speed of execution, our own code for speed of compile.
[profile.dev.package."*"]
opt-level = 3

[profile.dev]
opt-level = 1

[profile.release]
lto = "thin"
codegen-units = 1

# Used by `bevy build --release web`: small over fast, the browser downloads it.
[profile.web-release]
inherits = "release"
opt-level = "s"
lto = "fat"
strip = true
panic = "abort"
